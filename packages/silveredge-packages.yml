generated: '2026-08-12'
method: searched
source: >-
  https://chocolateplatform.com/download-sdk (SDK page, read from the site's own
  JS bundle), https://github.com/chocolateplatform (first-party sample apps),
  https://github.com/chocolateplatform/download-links (first-party download
  redirector + version.json)
ownership_note: >-
  Chocolate Platform is Silverpush's mobile video SSP — the site titles itself
  "Chocolate Platform by SilverPush" and the Prebid Server bidder registered as
  "silverpush" is maintained from prebid@silverpush.co and points at
  prebid.chocolateplatform.co. The chocolateplatform.com / github.com/chocolateplatform
  surface is therefore first-party to this company on a second brand domain.
summary: >-
  Silverpush publishes no client library on any public package registry — npm,
  PyPI, Maven Central, CocoaPods trunk, RubyGems, crates.io and NuGet all return
  nothing for silverpush, silveredge or chocolateplatform. What it does publish
  is the Chocolate Mediation SDK for mobile app publishers, distributed outside
  the registries. As of this pass EVERY distribution endpoint the company
  advertises for that SDK is unreachable, so no first-party client library is
  actually obtainable. That is why no `SDKs` pointer is wired in apis.yml: the
  packages are documented but not installable, and crediting them would assert a
  usable SDK surface that does not exist.
