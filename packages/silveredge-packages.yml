  note: >-
    The current chocolateplatform.com/download-sdk page states Android SDK 3.2.1,
    released March 10 2024, min API 21, ~420 KB, and gives this Gradle snippet.
    The repository host maven.chocolateplatform.com has NO DNS A record
    (NXDOMAIN as of 2026-08-12), so the dependency cannot resolve. Maven Central
    returns 0 artifacts for group com.chocolateplatform. Version and date are the
    provider's own published values, not a registry read — there is no registry
    metadata endpoint to query.
