summary: >-
  Silverpush publishes no status page, no SLA, no deprecation or sunset policy,
  and no dated changelog for any surface. What the public record does show is a
  developer surface in advanced decay: the SDK page still advertises 2024
  releases, but every channel that would deliver them is gone, the release-notes
  links on that page point at routes the application does not define, and the
  sample-app repositories have not been touched since 2020.
