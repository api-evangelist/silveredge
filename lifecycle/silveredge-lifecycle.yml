decay_signals:
  note: >-
    Recorded because these are the only dated, provider-published evidence of
    lifecycle state available for this company. Each is a probe result, not an
    inference.
  signals:
  - signal: every advertised SDK distribution endpoint is unreachable
    detail: >-
      maven.chocolateplatform.com has no DNS record; the CocoaPods pod is not on
      trunk (404); the Swift Package Manager repo github.com/chocolateplatform/ios-sdk
      returns 404; the GitLab release artifact returns 404; the CloudFront Unity
      package host does not answer; Bintray was retired in 2021. Full probe
      table in packages/silveredge-packages.yml.
  - signal: SDK sample repositories dormant
    detail: >-
      All ten first-party sample apps in github.com/chocolateplatform were last
      pushed between 2018-09-25 and 2020-02-28. The org itself was last updated
      2018-02-02.
  - signal: SilverPush GitHub org holds only Prebid forks
    detail: >-
      github.com/SilverPush contains three repositories, all forks of Prebid
      projects (prebid-server, Prebid.js, prebid.github.io), last pushed 2023.
      No first-party source is published there.
  - signal: registered Prebid endpoint would not complete a TLS handshake
    detail: >-
      https://prebid.chocolateplatform.co/bidder/?identifier=prebidchoc — the
      endpoint Silverpush registered upstream in prebid-server — resolves to
      143.244.220.62 and answers 308 over plain HTTP, but the HTTPS handshake
      failed with "tlsv1 alert internal error" from this client on 2026-08-12.
      Recorded as an observation; a single client's TLS failure is not proof the
      endpoint is down for Prebid Server itself.
  - signal: apex domain of the bid endpoint is dark
    detail: >-
      chocolateplatform.co (the .co apex under which the bid endpoint sits) has
      no A record, while the brand's live site is on chocolateplatform.com.
