name: Silveredge
description: >-
  Silveredge is SilverEdge Technologies, the operating entity behind the
  Silverpush brand — an AI-powered contextual intelligence and video advertising
  company backed by 500 Global, whose corporate site is silverpush.co. Silverpush
  sells Mirrors, a contextual intelligence suite for brand-safe video advertising
  across YouTube, CTV, TikTok, Meta and the open web, and Parallels, a
  moment-marketing platform. It also operates Chocolate Platform
  (chocolateplatform.com), the mobile video SSP it acquired with Vdopia, which is
  publicly branded "Chocolate Platform by SilverPush". Its machine-readable API
  surface is programmatic rather than REST: Silverpush maintains a first-party
  OpenRTB bid endpoint registered upstream in Prebid Server and Prebid.js under
  the bidder code "silverpush", with a published JSON Schema for its bid
  parameters and a maintainer address of prebid@silverpush.co. Chocolate also
  documents a first-party mobile mediation SDK for Android, iOS, Unity, Xamarin,
  Cordova and Cocos2d-x, with public sample apps on GitHub — though every
  distribution channel that surface advertises now fails to resolve. There is no
  public REST API, OpenAPI, developer portal, MCP server, agent card or
  /.well-known discovery surface on any host this company controls.
