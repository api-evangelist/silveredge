apis:
- name: Silverpush Prebid Bidder (Chocolate Ad Exchange)
  description: >-
    Silverpush's first-party programmatic bid endpoint, registered upstream in
    the Prebid ecosystem under the bidder code "silverpush" and maintained from
    prebid@silverpush.co. It speaks OpenRTB over HTTPS and is reachable through
    both the Prebid.js client adapter and the Prebid Server adapter. It fronts
    the Chocolate Ad Exchange, the mobile video SSP Silverpush operates and
    brands publicly as "Chocolate Platform by SilverPush". Access requires
    publisher setup and approval by Silverpush, which issues the publisherId
    that the bid parameter schema requires.
  humanURL: https://docs.prebid.org/dev-docs/bidders/silverpush.html
  baseURL: https://prebid.chocolateplatform.co/bidder/
